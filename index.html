<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>BYOB Sports</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      /* Top-aligned, NOT vertically centred. iOS anchors its "Open this page
         in <app>?" dialog to the middle of the viewport, so a centred layout
         puts the primary button directly underneath it and the tap hits the
         dialog instead of the button. Keep the button well above centre. */
      padding-top: 56px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #fff;
      color: #111;
    }
    main { width: 100%; max-width: 420px; text-align: center; padding: 32px 24px; }
    .mark { font-size: 44px; line-height: 1; margin-bottom: 16px; }
    h1 { font-size: 22px; font-weight: 600; margin: 0 0 8px; }
    p { font-size: 15px; line-height: 1.5; margin: 0 0 24px; opacity: .75; }
    .btn {
      display: block;
      width: 100%;
      max-width: 280px;
      margin: 10px auto 0;
      padding: 13px 20px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
    }
    .btn.primary { background: #111; color: #fff; }
    .btn.secondary { background: transparent; border: 1px solid #ccc; color: #111; font-weight: 500; }
    /* Always rendered, never revealed on a timer. An earlier version showed
       these after 2s if document.visibilityState was still 'visible' - but
       that stays 'visible' behind the iOS confirm dialog, so the reveal fired
       for everyone, including users whose app opened fine, and read as
       buttons popping in at staggered times. */
    .stores-label { font-size: 14px; margin: 26px 0 10px; opacity: .6; }

    /* Dark rules go LAST. They carry the same specificity as the light rules
       above, so source order decides the winner — moved earlier, the light
       .btn.secondary colour wins and paints #111 text on a #111 background,
       leaving the store buttons invisible in dark mode. */
    @media (prefers-color-scheme: dark) {
      body { background: #111; color: #f2f2f2; }
      .btn.primary { background: #f2f2f2; color: #111; }
      .btn.secondary { border-color: #444; color: #f2f2f2; }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark">🎾</div>
    <h1 id="heading">Opening BYOB Sports…</h1>
    <p id="sub">We're taking you back to the app.</p>

    <a class="btn primary" id="open" href="#">Open BYOB Sports</a>

    <p class="stores-label">Don't have the app?</p>
    <a class="btn secondary" href="https://apps.apple.com/us/app/byob-sports-social-tennis-app/id6751515573">Download for iPhone</a>
    <a class="btn secondary" href="https://play.google.com/store/apps/details?id=com.byobsports">Download for Android</a>
  </main>

  <!--
    The redirect fires from the END of <body>, never from <head>.

    Assigning location during head parsing commits a navigation before the body
    exists. iOS Safari hands the byobsports:// URL to the app, so the redirect
    appears to work — but the tab left behind never got a body. Switch back to
    Safari and it is a blank white page, with the fallback link that was meant
    to rescue the user never rendered. Parsing and painting the body first is
    what makes the leftover tab useful instead of blank.

    scripts/check-redirect.mjs fails CI if navigation reappears inside <head>.
  -->
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);

      // Best-effort tab close, requested so the browser does not linger after
      // handing off to the app.
      //
      // Read this before "fixing" it: iOS Safari REFUSES to close a tab it did
      // not open via script. MDN, Window.close(): a window is script-closable
      // only if web content opened it (window.open, or <a target="_blank">);
      // otherwise the call just logs "Scripts may not close windows that were
      // not opened by script" and does nothing. A link tapped from another app
      // opens the tab via the OS, so that is the common case and it will NOT
      // close. It DOES work in in-app browsers that opened us with window.open.
      // Never throws, so it is free to attempt.
      //
      // The only thing that actually stops the browser appearing at all is
      // Universal Links (associatedDomains + an apple-app-site-association
      // served as application/json from the domain root). GitHub Pages cannot
      // serve that file correctly, so it needs a different host.
      function tryClose() {
        try { window.close(); } catch (e) {}
      }

      // Trigger the close on RETURN, not immediately. The app taking over hides
      // this page; becoming visible again means the user has come back to a tab
      // they no longer need. Closing on a timer instead would strand anyone
      // whose app never opened - they would lose the button and the store links
      // with nothing to show for it.
      var handedOff = false;
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) handedOff = true;
        else if (handedOff) tryClose();
      });

      var sessionId = params.get('session_id');
      var cancelled = params.get('cancelled');
      var expired = params.get('expired');

      var deepLink = 'byobsports://home';
      if (sessionId) deepLink = 'byobsports://matches?paid=1';
      else if (cancelled) deepLink = 'byobsports://home/coaches/findCoaches';
      else if (expired) deepLink = 'byobsports://home/coaches/propose?expired=1';

      document.getElementById('open').href = deepLink;

      function redirect() {
        // Assignment, not replace(): this is the exact form measured to skip
        // the iOS confirmation prompt. Do not "tidy" it into replace()
        // without re-testing the prompt on a device.
        window.location.href = deepLink;
      }

      // Fire NOW, synchronously, at the end of <body>.
      //
      // The timing is load-bearing in BOTH directions and was settled on a
      // device, not from docs:
      //
      //   too early (from <head>) - the parser has not reached <body>, the
      //     navigation commits against a body-less document, and Safari is
      //     left showing a blank white page with no fallback button.
      //
      //   too late (window 'load' + requestAnimationFrame) - the document has
      //     finished loading, so iOS treats byobsports:// as a fresh scripted
      //     navigation and interrupts with "Open this page in BYOB Sports?".
      //     Verified on an iPhone 17 Pro simulator: that prompt appears with
      //     the deferred form and does NOT appear with this one.
      //
      // Here at the end of <body> the body is fully parsed but the document
      // load is still in flight, which satisfies both: no prompt, and a real
      // rendered page waiting behind the app.
      redirect();
    })();
  </script>
</body>
</html>
